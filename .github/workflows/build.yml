name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q FFOB55Panel.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
        working-directory: FFOB55Panel
      - uses: actions/upload-artifact@v4
        with:
          name: FFOB55Panel-debug-apk
          path: FFOB55Panel/app/build/outputs/apk/debug/app-debug.apk
